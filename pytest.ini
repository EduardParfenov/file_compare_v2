[pytest]
# Корень репозитория добавляется в sys.path — тесты импортируют модули
# приложения (`main`, `config`, `services`) и должны собираться из любого
# рабочего каталога, а не только из корня проекта.
pythonpath = .
# Сбор ограничен каталогом тестов: без этого bare-`pytest` из корня
# рекурсивно обходит .venv/ и другие служебные каталоги.
testpaths = tests
