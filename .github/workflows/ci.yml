# CI file-compare-v2 — автоматическая проверка изменений.
#
# Запускается на каждый pull request и на каждый push в основную ветку.
# Секреты не используются: набор тестов проходит на дефолтной конфигурации,
# а ИИ-роуты проверяются моками.

name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Минимальные права: workflow только читает код репозитория.
permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Подготовить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Установить зависимости
        # requirements-dev.txt подключает requirements.txt через -r
        run: pip install -r requirements-dev.txt

      - name: Проверить наличие OpenSpec CLI
        # OpenSpec CLI (openspec) — системный инструмент для управления
        # спецификациями и change'ами; не устанавливается через pip (пакет
        # openspec на PyPI — другой проект). В данном окружении CLI уже
        # доступен как /usr/local/bin/openspec (v1.12.0); на раннере GitHub
        # Actions требуется отдельная установка (см. документацию OpenSpec).
        # Этот шаг только информирует; отсутствие CLI проявится на шаге
        # валидации спецификаций (openspec validate --specs --strict).
        run: |
          if command -v openspec >/dev/null 2>&1; then
            echo "OpenSpec CLI найден: $(openspec --version)"
          else
            echo "Внимание: OpenSpec CLI не найден. Установите openspec согласно документации перед валидацией спецификаций." >&2
          fi

      - name: Проверить стиль кода (линтер)
        # ruff — линтер для Python (P2.11b). ruff.toml содержит временные
        # per-file-ignores для файлов с pre-existing нарушениями (см. ruff.toml).
        run: ruff check

      - name: Валидировать артефакты OpenSpec
        # openspec validate --specs --strict — проверяет валидность артефактов
        # change'ов (proposal, specs, design, tasks) по схеме spec-driven.
        # Не прохождение блокирует слияние (strict status check в ruleset main).
        run: openspec validate --specs --strict

      - name: Установить браузер для end-to-end теста
        # Без браузера тест фронтенда помечается как пропущенный,
        # и проверка перестаёт охватывать реальный сценарий.
        run: python -m playwright install --with-deps chromium

      - name: Запустить тесты
        run: pytest -q
